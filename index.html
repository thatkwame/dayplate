<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#194c3b"><title>Dayplate · Food diary</title><link rel="stylesheet" href="style.css?v=recipes1"><script defer src="foods.js"></script><script defer src="recipes.js"></script><script defer src="app.js?v=recipes1"></script></head>
<body><header><div class="bar"><b class="brand"><span aria-hidden="true">◒</span> Dayplate</b><nav><a href="#meals">Food diary</a><a href="#recipes">Recipes</a><a href="#calendar">Calendar</a></nav><button class="quiet" id="data">My data</button></div></header>
<main><div class="title"><div><p id="dateLabel"></p><h1>Food diary<span>.</span></h1></div><button id="add" class="primary">＋ Log food</button></div>
<div class="layout"><section><div class="energy"><div><b>Daily calories</b><div class="total"><strong id="total">0</strong> kcal</div><button id="goal" class="goal"></button><div id="remaining"></div></div><div class="plate" aria-hidden="true"><div>◒</div></div></div>
<div id="meals"><h2>Meal log</h2><div id="groups"></div></div>
<section class="card recipe-section" id="recipes"><h2>Recipe ideas</h2><p class="sub" id="recipe-context"></p>
<label for="recipe-meal">Meal</label><select id="recipe-meal"><option>All meals</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select>
<div id="recipe-list"></div></section></section>
<aside><section class="card" id="calendar"><div class="calhead"><h2>Calendar</h2><button class="quiet" id="today">Today</button></div><div class="month"><b id="month"></b><div><button id="prev" aria-label="Previous month">‹</button><button id="next" aria-label="Next month">›</button></div></div><div class="grid" id="days"></div><p class="legend"><i></i> Food logged</p></section><section class="card"><h2>Week at a glance</h2><p class="sub" id="weekRange"></p><div id="chart"></div><div class="foot"><span>Weekly total</span><b id="weekly"></b></div></section></aside></div></main>
<dialog id="dialog"><form id="form"><div class="calhead"><h2 id="modalTitle"></h2><button type="button" class="close" aria-label="Close">×</button></div><div id="fields"></div><p role="alert" id="error"></p><button class="primary" id="save">Save</button></form></dialog><div aria-live="polite" id="notice"></div></body></html>
